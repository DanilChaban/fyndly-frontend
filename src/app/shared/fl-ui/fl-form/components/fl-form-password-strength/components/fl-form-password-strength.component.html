@if (hasPassword()) {
  <div class="fl-form-password-strength" [ngClass]="strengthClass()">
    <div class="fl-form-password-strength__bars">
      @for (bar of bars; track bar) {
        <span
          class="fl-form-password-strength__bar"
          [class.fl-form-password-strength__bar--active]="bar < activeBars()"
        ></span>
      }
    </div>

    <span class="fl-form-password-strength__label">
      {{ label() | transloco }}
    </span>
  </div>
}
