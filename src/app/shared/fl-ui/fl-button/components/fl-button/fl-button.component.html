<button
  class="fl-button"
  [ngClass]="buttonClass()"
  [style]="customStyles()"
  [matButton]="appearance()"
  [disabled]="disabled()"
  [disableRipple]="variant() === 'text'"
  (click)="onClick()"
>
  @if (prefixIcon(); as icon) {
    <mat-icon class="fl-button__icon fl-button__icon--prefix" [svgIcon]="icon" />
  }

  <ng-content />

  @if (suffixIcon(); as icon) {
    <mat-icon class="fl-button__icon fl-button__icon--suffix" iconPositionEnd [svgIcon]="icon" />
  }
</button>
