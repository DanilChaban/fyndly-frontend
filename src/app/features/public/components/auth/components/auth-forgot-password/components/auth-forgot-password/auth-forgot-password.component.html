<fl-card>
  <app-auth-forgot-password-header
    [icon]="'lock-blue'"
    [title]="'auth.forgot_password.title'"
    [description]="'auth.forgot_password.description'"
  />
  <fl-card-content>
    <app-auth-forgot-password-form [retryAfterSeconds]="retryAfterSeconds()" (submitClicked)="onSubmit($event)" />
  </fl-card-content>
  <fl-card-actions>
    <app-auth-forgot-password-actions-backward />
  </fl-card-actions>
</fl-card>
