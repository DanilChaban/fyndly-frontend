<fl-card>
  <fl-card-header>
    <fl-card-title>{{ 'auth.signIn.title' | transloco }}</fl-card-title>
    <fl-card-subtitle>{{ 'auth.signIn.description' | transloco }}</fl-card-subtitle>
  </fl-card-header>
  <fl-card-content>
    <app-auth-sign-in-form />
  </fl-card-content>
  <fl-card-actions>
    <app-auth-actions-switch
      [text]="'auth.signIn.switchText' | transloco"
      [linkText]="'auth.signIn.switchLink' | transloco"
      link="sign-up"
    />
  </fl-card-actions>
</fl-card>
