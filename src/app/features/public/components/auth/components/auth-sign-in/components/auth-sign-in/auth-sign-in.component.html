<fl-card>
  <fl-card-header>
    <fl-card-title>{{ 'auth.sign_in.title' | transloco }}</fl-card-title>
    <fl-card-subtitle>{{ 'auth.sign_in.description' | transloco }}</fl-card-subtitle>
  </fl-card-header>
  <fl-card-content>
    <app-auth-sign-in-form
      [selectedEmail]="email()"
      [showUnverifiedWarning]="showUnverifiedWarning()"
      (submitClicked)="onSubmit($event)"
    />
  </fl-card-content>
  <fl-card-actions>
    <app-auth-actions-switch
      [text]="'auth.sign_in.switch_text'"
      [linkText]="'auth.sign_in.switch_link'"
      link="sign-up"
    />
  </fl-card-actions>
</fl-card>
