<fl-form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fl-form-input
    type="email"
    label="Email address"
    [prefixSvgIcon]="'mail'"
    placeholder="Email address"
    formControlName="email"
  />
  <fl-form-input
    type="password"
    label="Password"
    [prefixSvgIcon]="'lock'"
    [suffixSvgIcon]="'eye'"
    placeholder="Password"
    formControlName="password"
  />

  <fl-button type="submit" variant="primary">Sign in</fl-button>
</fl-form>

<app-auth-ui-divider />

<fl-button type="button" variant="secondary" [icon]="'google'">Continue with Google</fl-button>
