<fl-form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fl-form-input type="email" label="Email address" placeholder="Email address" formControlName="email" />
  <fl-form-input type="password" label="Password" placeholder="Password" formControlName="password" />

  <fl-button>Sign in</fl-button>
</fl-form>
